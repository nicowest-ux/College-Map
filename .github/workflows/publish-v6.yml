name: Publish hardened v6 branch
on:
  push:
    branches: [campus-map-v6-concierge]
    paths: [".github/workflows/publish-v6.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: campus-map-v6-concierge
      - name: Write hardened v6 files
        shell: bash
        run: |
          echo '[... ELLIPSIZATION ...]' | base64 -d | gzip -d > index.html
          echo '' | base64 -d | gzip -d > manifest.json
          echo '' | base64 -d | gzip -d > sw.js
      - name: Commit v6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v6: harden iPhone layout and hosted startup"
          git push origin HEAD:campus-map-v6-concierge
