name: Publish hardened v6 branch
on:
  push:
    branches: [campus-map-v6-concierge]
    paths:
      - ".github/workflows/publish-v6.yml"
      - ".v6_payload/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: campus-map-v6-concierge

      - name: Assemble hardened v6
        shell: bash
        run: |
          cat .v6_payload/html01 .v6_payload/html02 .v6_payload/html03 .v6_payload/html04 .v6_payload/html05 .v6_payload/html06 > /tmp/index.b64
          echo "665f7db2f6a5d1cd80085f55bb502a7c47f3ee9bfe9340520e40e10cb894bc81  /tmp/index.b64" | sha256sum -c -
          base64 -d /tmp/index.b64 | gzip -d > index.html
          base64 -d .v6_payload/manifest | gzip -d > manifest.json
          base64 -d .v6_payload/sw | gzip -d > sw.js

      - name: Validate generated files
        shell: bash
        run: |
          grep -q "Campus Navigator" index.html
          grep -q "viewport-fit=cover" index.html
          grep -q "campus-navigator-v6-20261002" sw.js
          python -m json.tool manifest.json >/dev/null

      - name: Commit hardened v6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v6: harden iPhone layout and hosted startup"
          git push origin HEAD:campus-map-v6-concierge
