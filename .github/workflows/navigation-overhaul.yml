name: Navigation overhaul checks
on:
  push:
    branches: [main, navigation-overhaul-v6, camera-guide-v6, annotated-navigation-seed, map-layer-overhaul-v6, guided-routing-overhaul-v6]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check JavaScript
        run: |
          node --check nav-core.js
          node --check room-guide-hints.js
          node --check annotated-nav.js
          node --check data.js
          node --check app.js
      - name: Navigation core tests
        run: node tests/navigation-core.test.cjs
      - name: Validate self-contained build
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'id="plannerSheet"' in s
          assert 'id="routeTrust"' in s
          assert 'CampusNavCore' in s
          assert 'v6 navigation experience overhaul' in s
          assert 'Heading assist' in s
          assert 'id="cameraGuide"' in s
          assert 'id="cameraVideo"' in s
          assert 'id="tourPickerSheet"' in s
          assert 'cameraGuideBtn' in s
          assert 'tourSceneUrl' in s
          assert 'getUserMedia' in s
          assert 'media-name=' in s
          assert 'corridorSvg' not in s
          assert 'clean map marker hierarchy' in s
          assert 'map-room-marker' in s
          assert 'CAMPUS_ANNOTATED_NAV' in s
          assert 'CAMPUS_ROOM_GUIDE_HINTS' in s
          assert 'Interactive corridor guidance' in s
          assert 'Follow official building signage' not in s
          assert 'use visible room numbers/signage' not in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/scripts').mkdir(exist_ok=True)
          for i,code in enumerate(scripts):
              Path(f'/tmp/scripts/{i}.js').write_text(code)
          print('inline scripts:',len(scripts))
          PY
          for f in /tmp/scripts/*.js; do node --check "$f"; done
      - name: Browser smoke test
        run: |
          python3 -m http.server 8000 >/tmp/campus-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo "Chrome unavailable on runner"; exit 1; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom "http://127.0.0.1:8000/?from=B007&to=B014" > /tmp/route-dom.html
          grep -q 'id="plannerSheet"' /tmp/route-dom.html || { echo "FAIL plannerSheet"; exit 1; }
          grep -q 'B007' /tmp/route-dom.html || { echo "FAIL B007"; exit 1; }
          grep -q 'B014' /tmp/route-dom.html || { echo "FAIL B014"; exit 1; }
          ! grep -q 'Campus Navigator could not start' /tmp/route-dom.html || { echo "FAIL runtime error"; exit 1; }
          ! grep -q '<div id="bootGuard"' /tmp/route-dom.html || { echo "FAIL boot guard"; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom "http://127.0.0.1:8000/?from=C101&to=C109" > /tmp/guided-dom.html
          grep -q 'Interactive corridor guidance' /tmp/guided-dom.html || { echo "FAIL guided corridor route"; exit 1; }
          ! grep -qi 'signage' /tmp/guided-dom.html || { echo "FAIL signage fallback"; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom "http://127.0.0.1:8000/?from=B007&place=CAREERS" > /tmp/careers-dom.html
          grep -q 'Futures Careers &amp; Guidance' /tmp/careers-dom.html || grep -q 'Futures Careers & Guidance' /tmp/careers-dom.html || { echo "FAIL careers target"; exit 1; }
          grep -Eq 'Surveyed turn-by-turn|Interactive corridor guidance' /tmp/careers-dom.html || { echo "FAIL careers corridor route"; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom "http://127.0.0.1:8000/?from=B007&place=TOILETS" > /tmp/toilet-dom.html
          grep -q 'Toilets' /tmp/toilet-dom.html || { echo "FAIL toilet target"; exit 1; }
          grep -Eq 'Surveyed turn-by-turn|Interactive corridor guidance' /tmp/toilet-dom.html || { echo "FAIL toilet corridor route"; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom "http://127.0.0.1:8000/?from=C101&to=C109&guide=1" > /tmp/active-guide-dom.html
          python - <<'PY'
          import re
          s=open('/tmp/active-guide-dom.html').read()
          m=re.search(r'id="nextInstruction"[^>]*>(.*?)</div>',s,re.S)
          assert m, 'active guidance instruction missing'
          t=re.sub('<[^>]+>',' ',m.group(1))
          assert 'Surveyed corridor' not in t, t
          assert any(x in t for x in ['Turn ','Continue ','Keep ','Leave ','Arrive ']), t
          assert 'follow signage' not in s.lower()
          print('active instruction:', ' '.join(t.split()))
          PY
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom "http://127.0.0.1:8000/?action=tour" > /tmp/tour-dom.html
          grep -q 'id="tourPickerSheet"' /tmp/tour-dom.html || { echo "FAIL tour picker"; exit 1; }
